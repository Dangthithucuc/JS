<body>
    <script>
       let result = incre([1,2,3,4]);
       let result2 = incre([-1,-2,-3,-4])();
        function incre(arr) {
            for ( let index in arr ) {
                arr[index] = arr[index] + 10;

            }
            return function() {
                for(let index in arr) {
                    arr[index] = arr[index] **2;
                }
                 return arr;
            };
           
        }
        console.log(result);
        console.log(result2);
        
        
    </script>
</body>
