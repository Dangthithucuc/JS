<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
      let students = [
    {
        id: "SV001",
        name: "Nguyễn Văn A",
        age: 20,
        gpa: 8.5,
        status: "active",
        createdAt: Date.now(),
        updatedAt: Date.now(),
        deletedAt: null
    },
    {
        id: "SV002",
        name: "Trần Thị B",
        age: 22,
        gpa: 7.2,
        status: "active",
        createdAt: Date.now(),
        updatedAt: Date.now(),
        deletedAt: null
    },
    {
        id: "SV003",
        name: "Lê Văn C",
        age: 19,
        gpa: 9.1,
        status: "inactive",
        createdAt: Date.now(),
        updatedAt: Date.now(),
        deletedAt: null
    },
    {
        id: "SV004",
        name: "Phạm Thị D",
        age: 25,
        gpa: 6.8,
        status: "active",
        createdAt: Date.now(),
        updatedAt: Date.now(),
        deletedAt: null
    },
    {
        id: "SV005",
        name: "Hoàng Văn E",
        age: 30,
        gpa: 5.9,
        status: "inactive",
        createdAt: Date.now(),
        updatedAt: Date.now(),
        deletedAt: null
    }
];
    let choice;

do {
    choice = +prompt(`
       ==== STUDENT MANAGER ADVANCED ====
          1.Create Student
          2.Update Student
          3.Soft Delete Student
          4.Restore Student
          5.View Students
          6.Analytics Dashboard
          7.Exit
    `);

    switch (choice) {

        case 1:

            let id;

            do {
                id = prompt("Nhập ID:");

                if (!id) {
                    alert("Không được để trống");
                    continue;
                }

                let result = students.some(function (stu) {
                    return stu.id === id;
                });

                if (result) {
                    alert("ID đã tồn tại! Nhập lại.");
                    continue;
                }

                break;

            } while (true);

            let name = prompt("Nhập tên sinh viên");
            let age = +prompt("Nhập tuổi:(0 <= age <= 60)");
            let gpa = +prompt("Nhập gpa:(0 <= gpa <= 10)");
            let status = prompt("Nhập trạng thái (active / inactive)").toLowerCase();

            let newStudent = {
                id,
                name,
                age,
                gpa,
                status,
                createdAt: Date.now(),
                updatedAt: null,
                deletedAt: null,
            };

            students.push(newStudent);
            alert("Thêm sinh viên thành công!");
            break;

     
                case 2:

    let updateId = prompt("Nhập ID sinh viên cần update:");

    let studentUpdate = students.find(stu => stu.id === updateId && stu.deletedAt === null);

    if (!studentUpdate) {
        alert("Không tìm thấy sinh viên!");
        break;
    }

    studentUpdate.name = prompt("Nhập tên mới:", studentUpdate.name);
    studentUpdate.age = +prompt("Nhập tuổi mới:", studentUpdate.age);
    studentUpdate.gpa = +prompt("Nhập gpa mới:", studentUpdate.gpa);
    studentUpdate.status = prompt("Nhập trạng thái mới:", studentUpdate.status);

    studentUpdate.updatedAt = Date.now();

    alert("Cập nhật thành công!");
    break;
    case 3:

    let deleteId = prompt("Nhập ID cần xóa:");

    let studentDelete = students.find(stu => stu.id === deleteId && stu.deletedAt === null);

    if (!studentDelete) {
        alert("Không tìm thấy hoặc đã bị xóa!");
        break;
    }

    studentDelete.deletedAt = Date.now();
    studentDelete.status = "inactive";

    alert("Soft delete thành công!");
    break;
             case 4:

    let restoreId = prompt("Nhập ID cần khôi phục:");

    let studentRestore = students.find(stu => stu.id === restoreId && stu.deletedAt !== null);

    if (!studentRestore) {
        alert("Không tìm thấy sinh viên bị xóa!");
        break;
    }

    studentRestore.deletedAt = null;
    studentRestore.status = "active";

    alert("Khôi phục thành công!");
    break;
    case 5:

    let activeStudents = students.filter(stu => stu.deletedAt === null);

    console.table(activeStudents);

    break;
    
    }

} while (choice !== 7);
    </script>
</body>
</html>
