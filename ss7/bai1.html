<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let playerIds = [] ;
        let playerPositions = [] ;
        let n;
        do {
            n = parseInt(prompt("Có bao nhiêu cầu thủ cần nhập vào đội bóng?(số nguyên dương)"))
        } while (isNaN(n) || n <= 0)
        for (let i = 0; i < n; i++) {
            alert(`Nhập cầu thủ ${ i + 1}`) ;
            let id;
            let isDuplicate = false;
            
            do {
                id  = prompt("Mã cầu thủ");
                for (let j = 0; j < playerIds.length; j++) {
                if (playerIds[j]  === id) {
                    alert("Mã đã tồn tại! Nhập lại.");
                    isDuplicate = true;
                    break;
                }
            }
            } while (!id || isDuplicate);
            playerIds.push(id);
            let player; 
            let result;
            do {
                player = +prompt("1:Thủ môn 2:Hậu vệ 3:Tiền vệ 4:Tiền đạo");
                switch(player) {
                    case 1: result = "Thủ môn"
                    break;
                    case 2: result = "Hậu vệ"
                    break;

                    case 3: result = "Tiền vệ"
                    break;
                    case 4: result = "Tiền đạo"
                    break;

                    default: 
                    alert("Lựa chọn không hợp lệ");
                    result = null;

                    
                } 
               
            }while (!result);
             playerPositions.push(result);
        }
    function printTeamRoster() {
      console.log(`Đội bóng hiện tại(${n} cầu thủ)`);
      for( let i = 0; i < n; i++) {
        console.log(`
        ${i + 1}. ${playerIds[i]} - ${playerPositions[i]}
        `);
            
        
        
      }
      
      
     
      
    }
    printTeamRoster();

    </script>
</body>
</html>
