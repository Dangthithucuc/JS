
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sản Phẩm</title>
   
    <style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #E3F2FD;
    min-height: 100vh;
    padding: 20px;
}

.container {
    max-width: 1400px;
    margin: 0 auto;
    background: white;
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.15);
    overflow: hidden;
    animation: slideIn 0.5s ease-out;
}

@keyframes slideIn {
    from {
        opacity: 0;
        transform: translateY(-30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* Header Styles */
.header {
    background: #1976D2;
    padding: 40px 30px;
    color: white;
    text-align: center;
}

.header h1 {
    font-size: 36px;
    margin-bottom: 10px;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
}

.subtitle {
    font-size: 16px;
    opacity: 0.9;
}

/* Form Section Styles */
.form-section {
    padding: 30px;
    background: #E3F2FD;
    border-bottom: 2px solid #90CAF9;
}

.form-section h2 {
    color: #1565C0;
    margin-bottom: 20px;
    font-size: 24px;
}

#productForm {
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
}

.form-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.form-group label {
    font-weight: 600;
    color: #333;
    font-size: 14px;
}

.required {
    color: #E53935;
}

.form-group input,
.form-group select,
.form-group textarea {
    padding: 12px 16px;
    border: 2px solid #90CAF9;
    border-radius: 8px;
    font-size: 16px;
    transition: all 0.3s ease;
    outline: none;
    font-family: inherit;
}

.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {
    border-color: #1976D2;
    box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
}

.form-group textarea {
    resize: vertical;
}

.form-actions {
    display: flex;
    gap: 12px;
    margin-top: 10px;
}

.btn-submit,
.btn-cancel,
.btn-clear {
    padding: 12px 32px;
    border: none;
    border-radius: 8px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-submit {
    background: #42A5F5;
    color: white;
    flex: 1;
}

.btn-submit:hover {
    background: #2196F3;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(66, 165, 245, 0.4);
}

.btn-cancel {
    background: #BDBDBD;
    color: white;
}

.btn-cancel:hover {
    background: #9E9E9E;
    transform: translateY(-2px);
}

.btn-clear {
    background: #EF5350;
    color: white;
}

.btn-clear:hover {
    background: #E53935;
    transform: translateY(-2px);
    box-shadow: 0 4px 12px rgba(239, 83, 80, 0.4);
}

/* Search Section */
.search-section {
    padding: 20px 30px;
    background: #F5F5F5;
    border-bottom: 1px solid #E0E0E0;
}

.search-group {
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 15px;
}

.search-group input,
.search-group select {
    padding: 12px 16px;
    border: 2px solid #90CAF9;
    border-radius: 8px;
    font-size: 16px;
    outline: none;
    transition: all 0.3s ease;
}

.search-group input:focus,
.search-group select:focus {
    border-color: #1976D2;
    box-shadow: 0 0 0 3px rgba(25, 118, 210, 0.1);
}

/* List Section Styles */
.list-section {
    padding: 30px;
}

.list-section h2 {
    color: #1565C0;
    margin-bottom: 20px;
    font-size: 24px;
}

.table-container {
    overflow-x: auto;
    border-radius: 10px;
    border: 1px solid #E0E0E0;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
}

thead {
    background: #1976D2;
    color: white;
}

thead th {
    padding: 16px;
    text-align: left;
    font-weight: 600;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

tbody tr {
    border-bottom: 1px solid #E0E0E0;
    transition: all 0.3s ease;
    animation: rowSlideIn 0.3s ease-out;
}

@keyframes rowSlideIn {
    from {
        opacity: 0;
        transform: translateX(-20px);
    }
    to {
        opacity: 1;
        transform: translateX(0);
    }
}

tbody tr:hover {
    background: #E3F2FD;
}

tbody td {
    padding: 16px;
    color: #333;
    font-size: 14px;
}

.price {
    color: #4CAF50;
    font-weight: 600;
}

.quantity {
    text-align: center;
    font-weight: 600;
}

.low-stock {
    color: #FF5722;
}

.description {
    max-width: 200px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.action-buttons {
    display: flex;
    gap: 8px;
}

.btn-edit,
.btn-delete {
    padding: 6px 16px;
    border: none;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.3s ease;
}

.btn-edit {
    background: #FFA726;
    color: white;
}

.btn-edit:hover {
    background: #FB8C00;
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(255, 167, 38, 0.3);
}

.btn-delete {
    background: #EF5350;
    color: white;
}

.btn-delete:hover {
    background: #E53935;
    transform: translateY(-2px);
    box-shadow: 0 4px 8px rgba(239, 83, 80, 0.3);
}

/* Empty State */
.empty-state {
    text-align: center;
    padding: 60px 20px;
    color: #999;
    display: none;
}

.empty-state.show {
    display: block;
}

.empty-state-icon {
    font-size: 64px;
    margin-bottom: 16px;
}

.empty-state-text {
    font-size: 18px;
}

/* Footer Styles */
.footer {
    background: #E3F2FD;
    padding: 25px 30px;
    border-top: 2px solid #90CAF9;
}

.stats {
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 20px;
}

.stat-item {
    font-size: 16px;
    color: #666;
}

.stat-item strong {
    color: #1976D2;
    font-size: 20px;
    font-weight: bold;
    display: block;
    margin-top: 5px;
}

/* Responsive Design */
@media (max-width: 1024px) {
    .search-group {
        grid-template-columns: 1fr;
    }
}

@media (max-width: 768px) {
    .container {
        border-radius: 0;
    }

    .header h1 {
        font-size: 28px;
    }

    .form-section,
    .list-section {
        padding: 20px;
    }

    .form-row {
        grid-template-columns: 1fr;
    }

    .form-actions {
        flex-direction: column;
    }

    .btn-submit,
    .btn-cancel,
    .btn-clear {
        width: 100%;
    }

    table {
        font-size: 12px;
    }

    thead th,
    tbody td {
        padding: 10px 8px;
    }

    .action-buttons {
        flex-direction: column;
    }

    .btn-edit,
    .btn-delete {
        width: 100%;
    }

    .stats {
        flex-direction: column;
        text-align: center;
    }
}

@media (max-width: 480px) {
    thead th:nth-child(1),
    tbody td:nth-child(1),
    thead th:nth-child(6),
    tbody td:nth-child(6) {
        display: none;
    }
}
    </style>
</head>
<body>
    <div class="container">
       
        <header class="header">
            <h1>🛍️ Quản Lý Sản Phẩm</h1>
            <p class="subtitle">Hệ thống quản lý với LocalStorage</p>
        </header>

        <section class="form-section">
            <h2 id="formTitle">Thêm Sản Phẩm Mới</h2>
            <form id="productForm">
                <div class="form-row">
                    <div class="form-group">
                        <label for="productName">Tên Sản Phẩm <span class="required">*</span></label>
                        <input 
                            type="text" 
                            id="productName" 
                            placeholder="Nhập tên sản phẩm..."
                            autocomplete="off"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="productCategory">Danh Mục <span class="required">*</span></label>
                        <select id="productCategory" required>
                            <option value="">-- Chọn danh mục --</option>
                            <option value="Điện tử">Điện tử</option>
                            <option value="Thời trang">Thời trang</option>
                            <option value="Thực phẩm">Thực phẩm</option>
                            <option value="Đồ gia dụng">Đồ gia dụng</option>
                            <option value="Sách">Sách</option>
                            <option value="Khác">Khác</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="productPrice">Giá (VNĐ) <span class="required">*</span></label>
                        <input 
                            type="number" 
                            id="productPrice" 
                            placeholder="0"
                            min="0"
                            step="1000"
                            required
                        >
                    </div>
                    <div class="form-group">
                        <label for="productQuantity">Số Lượng <span class="required">*</span></label>
                        <input 
                            type="number" 
                            id="productQuantity" 
                            placeholder="0"
                            min="0"
                            required
                        >
                    </div>
                </div>

                <div class="form-group">
                    <label for="productDescription">Mô Tả</label>
                    <textarea 
                        id="productDescription" 
                        placeholder="Nhập mô tả sản phẩm..."
                        rows="3"
                    ></textarea>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-submit" id="submitBtn">
                        ➕ Thêm Sản Phẩm
                    </button>
                    <button type="button" class="btn-cancel" id="cancelBtn" style="display: none;">
                        ❌ Hủy
                    </button>
                    <button type="button" class="btn-clear" id="clearAllBtn">
                        🗑️ Xóa Tất Cả
                    </button>
                </div>
            </form>
        </section>

       
        <section class="search-section">
            <div class="search-group">
                <input 
                    type="text" 
                    id="searchInput" 
                    placeholder="🔍 Tìm kiếm theo tên sản phẩm..."
                    autocomplete="off"
                >
                <select id="filterCategory">
                    <option value="">Tất cả danh mục</option>
                    <option value="Điện tử">Điện tử</option>
                    <option value="Thời trang">Thời trang</option>
                    <option value="Thực phẩm">Thực phẩm</option>
                    <option value="Đồ gia dụng">Đồ gia dụng</option>
                    <option value="Sách">Sách</option>
                    <option value="Khác">Khác</option>
                </select>
            </div>
        </section>

      
        <section class="list-section">
            <h2>Danh Sách Sản Phẩm</h2>
            <div class="table-container">
                <table id="productTable">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tên Sản Phẩm</th>
                            <th>Danh Mục</th>
                            <th>Giá</th>
                            <th>Số Lượng</th>
                            <th>Mô Tả</th>
                            <th>Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody id="productTableBody">
                     
                    </tbody>
                </table>
                <div class="empty-state" id="emptyState">
                    <div class="empty-state-icon">📦</div>
                    <div class="empty-state-text">Chưa có sản phẩm nào. Hãy thêm sản phẩm mới!</div>
                </div>
            </div>
        </section>

        
        <footer class="footer">
            <div class="stats">
                <span class="stat-item">
                    Tổng sản phẩm: <strong id="totalProducts">0</strong>
                </span>
                <span class="stat-item">
                    Tổng giá trị: <strong id="totalValue">0 VNĐ</strong>
                </span>
                <span class="stat-item">
                    Tổng số lượng: <strong id="totalQuantity">0</strong>
                </span>
            </div>
        </footer>
    </div>

    <script >
       
const STORAGE_KEY = 'products_data';


let products = [];
let productIdCounter = 1;
let editingProductId = null;


const productForm = document.getElementById('productForm');
const formTitle = document.getElementById('formTitle');
const submitBtn = document.getElementById('submitBtn');
const cancelBtn = document.getElementById('cancelBtn');
const clearAllBtn = document.getElementById('clearAllBtn');

const productName = document.getElementById('productName');
const productCategory = document.getElementById('productCategory');
const productPrice = document.getElementById('productPrice');
const productQuantity = document.getElementById('productQuantity');
const productDescription = document.getElementById('productDescription');

const searchInput = document.getElementById('searchInput');
const filterCategory = document.getElementById('filterCategory');

const productTableBody = document.getElementById('productTableBody');
const emptyState = document.getElementById('emptyState');
const totalProducts = document.getElementById('totalProducts');
const totalValue = document.getElementById('totalValue');
const totalQuantity = document.getElementById('totalQuantity');




function saveToLocalStorage() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({
        products: products,
        idCounter: productIdCounter
    }));
}


function loadFromLocalStorage() {
    const data = localStorage.getItem(STORAGE_KEY);
    if (data) {
        try {
            const parsed = JSON.parse(data);
            products = parsed.products || [];
            productIdCounter = parsed.idCounter || 1;
        } catch (e) {
            console.error('Error loading data from localStorage:', e);
            products = [];
            productIdCounter = 1;
        }
    }
}


function clearAllData() {
    const confirm = window.confirm('Bạn có chắc chắn muốn xóa TẤT CẢ sản phẩm? Hành động này không thể hoàn tác!');
    if (confirm) {
        products = [];
        productIdCounter = 1;
        saveToLocalStorage();
        renderProducts();
        updateStats();
        alert('Đã xóa tất cả sản phẩm!');
    }
}



function init() {
    loadFromLocalStorage();
    renderProducts();
    updateStats();
    
    
    productForm.addEventListener('submit', handleFormSubmit);
    cancelBtn.addEventListener('click', cancelEdit);
    clearAllBtn.addEventListener('click', clearAllData);
    searchInput.addEventListener('input', handleSearch);
    filterCategory.addEventListener('change', handleFilter);
}



function handleFormSubmit(e) {
    e.preventDefault();
    
   
    const name = productName.value.trim();
    const category = productCategory.value;
    const price = parseFloat(productPrice.value);
    const quantity = parseInt(productQuantity.value);
    const description = productDescription.value.trim();
    
    
    if (!name || !category || isNaN(price) || isNaN(quantity)) {
        alert('Vui lòng điền đầy đủ thông tin!');
        return;
    }
    
    if (price < 0) {
        alert('Giá không được âm!');
        return;
    }
    
    if (quantity < 0) {
        alert('Số lượng không được âm!');
        return;
    }
    
    if (editingProductId) {
       
        updateProduct(editingProductId, name, category, price, quantity, description);
    } else {
       
        addProduct(name, category, price, quantity, description);
    }
    
   
    resetForm();
}


function addProduct(name, category, price, quantity, description) {
    const newProduct = {
        id: productIdCounter++,
        name: name,
        category: category,
        price: price,
        quantity: quantity,
        description: description,
        createdAt: new Date().toISOString()
    };
    
    products.push(newProduct);
    saveToLocalStorage();
    renderProducts();
    updateStats();
}


function updateProduct(id, name, category, price, quantity, description) {
    const product = products.find(p => p.id === id);
    if (product) {
        product.name = name;
        product.category = category;
        product.price = price;
        product.quantity = quantity;
        product.description = description;
        product.updatedAt = new Date().toISOString();
        
        saveToLocalStorage();
        renderProducts();
        updateStats();
    }
}


function deleteProduct(id) {
    const product = products.find(p => p.id === id);
    if (!product) return;
    
    const confirmDelete = confirm(`Bạn có chắc chắn muốn xóa sản phẩm "${product.name}"?`);
    
    if (confirmDelete) {
        products = products.filter(p => p.id !== id);
        saveToLocalStorage();
        renderProducts();
        updateStats();
        
       
        if (editingProductId === id) {
            resetForm();
        }
    }
}


function editProduct(id) {
    const product = products.find(p => p.id === id);
    if (!product) return;
    
   
    productName.value = product.name;
    productCategory.value = product.category;
    productPrice.value = product.price;
    productQuantity.value = product.quantity;
    productDescription.value = product.description || '';
    
    // Cập nhật UI
    formTitle.textContent = 'Chỉnh Sửa Sản Phẩm';
    submitBtn.innerHTML = '💾 Cập Nhật';
    cancelBtn.style.display = 'block';
    
    
    editingProductId = id;
    
    
    document.querySelector('.form-section').scrollIntoView({ behavior: 'smooth' });
    productName.focus();
}


function cancelEdit() {
    resetForm();
}


function resetForm() {
    productForm.reset();
    formTitle.textContent = 'Thêm Sản Phẩm Mới';
    submitBtn.innerHTML = '➕ Thêm Sản Phẩm';
    cancelBtn.style.display = 'none';
    editingProductId = null;
}




function renderProducts(filteredProducts = null) {
    const productsToRender = filteredProducts || products;
    
    productTableBody.innerHTML = '';
    
    if (productsToRender.length === 0) {
        emptyState.classList.add('show');
        return;
    }
    
    emptyState.classList.remove('show');
    
    productsToRender.forEach(product => {
        const row = createProductRow(product);
        productTableBody.appendChild(row);
    });
}


function createProductRow(product) {
    const tr = document.createElement('tr');
    
    const priceFormatted = formatPrice(product.price);
    const quantityClass = product.quantity < 10 ? 'low-stock' : '';
    
    tr.innerHTML = `
        <td>${product.id}</td>
        <td><strong>${product.name}</strong></td>
        <td>${product.category}</td>
        <td class="price">${priceFormatted}</td>
        <td class="quantity ${quantityClass}">${product.quantity}</td>
        <td class="description">${product.description || 'Không có mô tả'}</td>
        <td>
            <div class="action-buttons">
                <button class="btn-edit" onclick="editProduct(${product.id})">
                    ✏️ Sửa
                </button>
                <button class="btn-delete" onclick="deleteProduct(${product.id})">
                    🗑️ Xóa
                </button>
            </div>
        </td>
    `;
    
    return tr;
}


function formatPrice(price) {
    return new Intl.NumberFormat('vi-VN', {
        style: 'currency',
        currency: 'VND'
    }).format(price);
}



function handleSearch() {
    const searchTerm = searchInput.value.toLowerCase().trim();
    const categoryFilter = filterCategory.value;
    
    let filtered = products;
    
  
    if (searchTerm) {
        filtered = filtered.filter(p => 
            p.name.toLowerCase().includes(searchTerm) ||
            p.description.toLowerCase().includes(searchTerm)
        );
    }
    
   
    if (categoryFilter) {
        filtered = filtered.filter(p => p.category === categoryFilter);
    }
    
    renderProducts(filtered);
}

function handleFilter() {
    handleSearch(); 
}



function updateStats() {
  
    totalProducts.textContent = products.length;
    
   
    const total = products.reduce((sum, p) => sum + (p.price * p.quantity), 0);
    totalValue.textContent = formatPrice(total);
    
    
    const quantity = products.reduce((sum, p) => sum + p.quantity, 0);
    totalQuantity.textContent = quantity;
}


init();
    </script>
</body>
</html>
